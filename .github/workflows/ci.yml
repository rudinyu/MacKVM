name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-and-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test app bundles
        env:
          RUN_WINDOWS_CI: "1"
        run: ./scripts/ci.sh
